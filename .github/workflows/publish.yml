name: Publish kiosk

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh technology headlines
        run: python scripts/update_news.py
      - name: Test feed parsing
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Save a monthly news snapshot
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          snapshot_month="$(git show HEAD:data/news.json | python -c 'import json,sys; print(json.load(sys.stdin).get("updatedAt", "")[:7])')"
          current_month="$(date -u +%Y-%m)"
          if [ "$snapshot_month" != "$current_month" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/news.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh monthly kiosk news snapshot"
              git push origin HEAD:main
            fi
          fi
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html style.css app.js kiosk.css kiosk.js config.js .nojekyll _site/
          cp -R assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
